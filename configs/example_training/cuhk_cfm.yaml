##############################################################################
# EMRDM — Consistency Flow Matching (CUHK-CR1 dataset)
#
# Implements Direction 3: Consistency Flow Matching (CFM) for cloud removal.
#
# Key idea
# --------
# CFM unifies Flow Matching (straight OT paths) with the consistency
# self-constraint (same velocity predicted for any t on the same trajectory):
#
#   x_t = (1-t)·μ + t·x_clean            (OT path, no extra noise)
#   Loss: consistency + supervised FM anchor
#         ‖v_θ(x_{t_n}, t_n) − v_{θ⁻}(x_{t_{n+1}}, t_{n+1})‖²
#       + ‖v_θ(x_{t_n}, t_n) − (x_clean − μ)‖²
#
# Training from scratch — no pre-trained checkpoint required.
# At inference a SINGLE network call recovers the cloud-free image:
#   x_clean ≈ μ + v_θ(μ, σ_max) · σ_max
#
# Comparison table
# ----------------
# | Component     | FM (Direction 1)              | CFM (Direction 3)               |
# |---------------|-------------------------------|---------------------------------|
# | engine        | ResidualDiffusionEngine       | ConsistencyFlowMatchingEngine   |
# | loss          | FlowMatchingResidualDiffLoss  | ConsistencyFlowMatchingLoss     |
# | sampler       | FlowMatchingResidualSampler   | ConsistencyFlowMatchingSampler  |
# | inference     | 4–10 Euler steps              | 1 step (default)               |
# | teacher       | none                          | EMA of student (0.9999 decay)   |
# | path          | straight OT (same)            | straight OT                     |
# | pre-training  | not required                  | not required                    |
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion_cfm.ConsistencyFlowMatchingEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    compile_model: False
    use_flash_attn2: False
    image_metrics: "evaluator"
    teacher_ema_decay: 0.9999       # EMA decay for the CFM teacher model

    # Optional: warm-start from an FM checkpoint for faster convergence.
    # ckpt_path: "/path/to/fm_pretrained.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_cfm.ConsistencyFlowMatchingSigma2St
      # s(σ) = 1 − σ = t  (no extra params)

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling_cfm.ConsistencyFlowMatchingScaling
          # c_skip=0, c_out=1, c_in=1  — raw network output IS the velocity

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    # ── CFM consistency loss ───────────────────────────────────────────────
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_cfm.ConsistencyFlowMatchingLoss
      params:
        loss_type: "l2"
        consistency_loss_weight: 1.0
        fm_loss_weight: 1.0         # supervised anchor: v* = x_clean - μ
        # Number of σ levels used to sample consecutive (σ_n, σ_{n+1}) pairs.
        # More steps → finer pairs, better coverage of the OT path.
        num_steps: 18
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 0.999
            rho: 1       # linear σ schedule  ↔  uniform t training

    # ── 1-step CFM sampler for validation / inference ─────────────────────
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_cfm.ConsistencyFlowMatchingSampler
      params:
        # Set num_steps=1 for true 1-step inference; >1 falls back to FM Euler.
        num_steps: 1
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 0.999
            rho: 1

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: True

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: False

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: False

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: False

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 1000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 500

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: False
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: False
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 6,7
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 1
    max_epochs: 500
