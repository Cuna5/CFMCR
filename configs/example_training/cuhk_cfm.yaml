##############################################################################
# EMRDM — Consistency Flow Matching (CUHK-CR1 dataset)
#
# Key idea
# --------
# CFM uses a straight OT path plus endpoint / velocity consistency:
#
#   x_t = (1-t)·μ + t·x_clean            (OT path, no extra noise)
#   f_θ(t, x_t) = x_t + (1-t)·v_θ(x_t, t)
#   Loss: endpoint consistency + velocity consistency + clean endpoint anchor
#
# Training from scratch — no pre-trained checkpoint required.
# At inference a SINGLE network call recovers the cloud-free image:
#   x_clean ≈ μ + v_θ(μ, σ_max)
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion_cfm.ConsistencyFlowMatchingEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    log_keys: ["cond_image"]
    compile_model: False
    use_flash_attn2: False
    image_metrics: "evaluator"
    teacher_ema_decay: 0.9999       # EMA decay for the CFM teacher model
    count_sample_time: True
    count_train_time: True

    # Optional: warm-start from a CFM checkpoint.
    # ckpt_path: "/path/to/cfm_pretrained.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_cfm.ConsistencyFlowMatchingSigma2St
      # s(σ) = 1 − σ = t  (no extra params)

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling_cfm.ConsistencyFlowMatchingScaling
          # c_skip=0, c_out=1, c_in=1  — raw network output IS the velocity

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1
        use_aux_cond: true
        aux_channels: 5
        aux_hidden_channels: 64
        aux_global_mode: "tmm"
        aux_tmm_gate_hidden_channels: 32
        # Cloud-probability head (zero-init, checkpoint warm-start safe).
        # Enable together with loss cloud_mask_pred_loss_weight > 0 and
        # sampler mask_composite (B1 ablation).
        predict_cloud_mask: false

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder
          - is_trainable: False
            input_key: "aux_cond"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.DictEmbedder
            params:
              output_key: "aux_cond"

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    # ── CFM consistency loss ───────────────────────────────────────────────
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_cfm.ConsistencyFlowMatchingLoss
      params:
        loss_type: "charbonnier"
        charbonnier_eps: 1.0e-3
        endpoint_loss_weight: 0.5    # teacher endpoint consistency
        consistency_loss_weight: 0.5 # teacher velocity consistency
        velocity_anchor_loss_weight: 1.0 # supervised v* = x_clean - μ
        clean_endpoint_loss_weight: 1.0  # direct fθ -> x_clean metric anchor
        ssim_endpoint_loss_weight: 0.0   # MS-SSIM on fθ vs x_clean; scan 0.02/0.05/0.1/0.2
        non_cloud_identity_loss_weight: 0.2  # penalise changes to clear pixels; scan 0.1/0.2/0.3
        cloud_mask_pred_loss_weight: 0.0     # BCE for the cloud-prob head; must be >0 when predict_cloud_mask=true
        cloud_mask_key: "M"              # CUHK dataloader cloud mask
        cloud_loss_weight: 2.0           # cloud pixels are weighted 2x, then normalized per sample
        cloud_weight_velocity_anchor: True
        feather_mask_kernel: 7           # 软化云掩膜核大小（奇数，如 7 或 11），0 表示关闭，用于减少边缘扭曲
        start_pair_prob: 0.35            # oversample σ≈1 for 1-step quality
        # Two-stage training (Yang et al. 2024, Sec. 4.2): the endpoint /
        # velocity consistency terms are linearly ramped up from 0 over the
        # first `consistency_warmup_steps` updates so the student + teacher
        # first learn a correct velocity from supervised anchors.
        consistency_warmup_steps: 2000
        # Number of σ levels used to sample consecutive (σ_n, σ_{n+1}) pairs.
        # More steps → finer pairs, better coverage of the OT path.
        num_steps: 40
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0   # σ=1 matches t=0 (start from μ); scaling clamps log
            rho: 1       # linear σ schedule  ↔  uniform t training

    # ── 1-step CFM sampler for validation / inference ─────────────────────
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_cfm.ConsistencyFlowMatchingSampler
      params:
        # Set num_steps=1 for true 1-step inference; >1 uses CFM Euler steps.
        num_steps: 1
        # Test-Time Augmentation: average 4 geometric variants (orig + hflip
        # + vflip + hvflip).  Typically +0.1~0.3 dB PSNR at 4× inference cost.
        # Enable via CLI: model.params.sampler_config.params.tta=True
        tta: False
        # Stochastic churn for multi-step CFM sampling only (num_steps > 1).
        # sigma_hat is clamped to sigma_max to avoid leaving the trained range.
        s_churn: 0.0
        s_tmin: 0.0
        s_tmax: 100000000.0
        s_noise: 1.0
        # clamp final output to [-1,1] so outlier pixels cannot hurt RMSE/PSNR
        clamp_output: false
        # blend prediction with input using the predicted cloud probability:
        # x_final = (1-m)*mu + m*x_pred (requires predict_cloud_mask=true)
        mask_composite: false
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    scheduler_config:
      target: sgm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        # Multipliers applied on top of base_learning_rate (1e-4).
        # Warmup 0.01→1.0 over 2000 steps, then cosine decay to 0.01.
        warm_up_steps: 2000
        lr_start: 0.01
        lr_max: 1.0
        lr_min: 0.01
        max_decay_steps: 100000

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: True
        augment: True
        hflip_p: 0.5
        vflip_p: 0.5
        rot90_p: 0.5
        aux_mode: "ndvi_only"

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: False
        aux_mode: "ndvi_only"

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: False
        aux_mode: "ndvi_only"

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: False
        aux_mode: "ndvi_only"

lightning:
  strategy:
    target: pytorch_lightning.strategies.DDPStrategy
    params:
      find_unused_parameters: true

  modelcheckpoint:
    params:
      every_n_train_steps: 1000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 500

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: False
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: False
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 6,7
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 1
    max_epochs: 500
