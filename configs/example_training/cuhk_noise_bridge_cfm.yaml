##############################################################################
# Noise-Bridge CFM — CUHK-CR1
#
# Both student and EMA teacher points use the same noisy start:
#   y = cloudy + noise_sigma * eps
#   x_t = (1-t) * y + t * clean
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion_cfm.ConsistencyFlowMatchingEngine
  params:
    input_key: "label"
    mean_key: "cond_image"
    log_keys: ["cond_image"]
    compile_model: false
    use_flash_attn2: false
    image_metrics: "evaluator"
    teacher_ema_decay: 0.9999
    count_sample_time: true
    count_train_time: true

    # ckpt_path: "/path/to/cuhk_cfm.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_cfm.ConsistencyFlowMatchingSigma2St

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling_cfm.ConsistencyFlowMatchingScaling

    network_wrapper: sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels: 8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global", d_head: 64}
          - {type: "global", d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1
        use_aux_cond: true
        aux_channels: 5
        aux_hidden_channels: 64
        aux_global_mode: "tmm"
        aux_tmm_gate_hidden_channels: 32
        predict_cloud_mask: false

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: true
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder
          - is_trainable: false
            input_key: "aux_cond"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.DictEmbedder
            params:
              output_key: "aux_cond"

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_noise_bridge_cfm.NoiseBridgeConsistencyFlowMatchingLoss
      params:
        noise_sigma: 0.10
        noise_ramp_steps: 0
        loss_type: "charbonnier"
        charbonnier_eps: 1.0e-3
        endpoint_loss_weight: 0.5
        consistency_loss_weight: 0.5
        velocity_anchor_loss_weight: 1.0
        clean_endpoint_loss_weight: 1.0
        start_pair_prob: 0.35
        consistency_warmup_steps: 2000
        cloud_loss_weight: 1.0
        cloud_weight_velocity_anchor: false
        non_cloud_identity_loss_weight: 0.0
        ssim_endpoint_loss_weight: 0.0
        cloud_mask_pred_loss_weight: 0.0
        num_steps: 40
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_noise_bridge_cfm.NoiseBridgeConsistencyFlowMatchingSampler
      params:
        noise_sigma: 0.10
        num_steps: 1
        tta: false
        s_churn: 0.0
        clamp_output: true
        mask_composite: false
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    scheduler_config:
      target: sgm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 2000
        lr_start: 0.01
        lr_max: 1.0
        lr_min: 0.01
        max_decay_steps: 100000

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    wrap: true
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: true
        augment: true
        hflip_p: 0.5
        vflip_p: 0.5
        rot90_p: 0.5
        aux_mode: "ndvi_only"
        mask_gain: 4.0
    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: false
        aux_mode: "ndvi_only"
        mask_gain: 4.0
    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: false
        aux_mode: "ndvi_only"
        mask_gain: 4.0
    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: false
        aux_mode: "ndvi_only"
        mask_gain: 4.0

lightning:
  strategy:
    target: pytorch_lightning.strategies.DDPStrategy
    params:
      find_unused_parameters: false
  modelcheckpoint:
    params:
      every_n_train_steps: 1000
      monitor: "RMSE"
  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 500
    image_logger:
      target: main.ImageLogger
      params:
        disabled: false
        batch_frequency: 500
        max_images: 64
        increase_log_steps: false
        log_first_step: false
        log_images_kwargs:
          use_ema_scope: false
          N: 64
          n_rows: 16
          return_intermediate: true
          return_denoised: true
          return_add_mu: false
          return_add_noise: false
          return_cond: true
  trainer:
    devices: "6,7"
    num_sanity_val_steps: 0
    benchmark: true
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 1
    gradient_clip_val: 1.0
    max_epochs: 500
