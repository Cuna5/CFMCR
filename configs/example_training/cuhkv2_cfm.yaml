##############################################################################
# EMRDM — Consistency Flow Matching (CUHK-CR2 dataset)
#
# Same CFM approach as cuhk_cfm.yaml, adapted for the CUHK-CR2 dataset:
#   - batch_size: 1
#   - check_val_every_n_epoch: 5
#   - max_epochs: 2000
#   - loss uses consistency + supervised FM velocity anchor
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion_cfm.ConsistencyFlowMatchingEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    compile_model: False
    use_flash_attn2: False
    image_metrics: "evaluator"
    teacher_ema_decay: 0.9999

    # Optional: warm-start from an FM or EMRDM checkpoint.
    # ckpt_path: "/path/to/cuhkv2_pretrained.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_cfm.ConsistencyFlowMatchingSigma2St

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling_cfm.ConsistencyFlowMatchingScaling

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_cfm.ConsistencyFlowMatchingLoss
      params:
        loss_type: "l2"
        consistency_loss_weight: 1.0
        fm_loss_weight: 1.0         # supervised anchor: v* = x_clean - μ
        num_steps: 18
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 0.999
            rho: 1

    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_cfm.ConsistencyFlowMatchingSampler
      params:
        num_steps: 1
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 0.999
            rho: 1

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR2"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR2"
        isTrain: True

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR2"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR2"
        isTrain: False

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR2"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR2"
        isTrain: False

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR2"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR2"
        isTrain: False

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 10000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 5000

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: True
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: False
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 2,
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 5
    max_epochs: 2000
