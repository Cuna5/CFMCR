##############################################################################
# EMRDM — Consistency Distillation (1-step cloud removal, CUHK-CR2 dataset)
#
# 与 cuhkv2.yaml 的差异：
#   - model.target  → ConsistencyResidualDiffusionEngine
#   - loss_fn       → ConsistencyResidualDiffusionLoss
#   - sampler       → ConsistencyResidualSampler（推理只需 1 步）
#   - 学习率降低至 2e-5（蒸馏微调阶段）
#   - max_epochs    → 500（蒸馏收敛更快）
#
# cuhkv2 专有保留项：
#   - denoiser_scaling 中的 sigma_cov: 0.9
#   - CUHK-CR2 数据路径、batch_size=1、check_val_every_n_epoch=5
#   - 原始 loss_weighting / sigma_sampler / s_churn 不再使用；
#     CD loss 直接从 discretization_config 采样相邻 sigma 对。
##############################################################################

model:
  base_learning_rate: 2.0e-5          # 蒸馏微调使用更小的学习率
  target: sgm.models.diffusion.ConsistencyResidualDiffusionEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    compile_model: False
    use_flash_attn2: False
    image_metrics: "evaluator"
    teacher_ema_decay: 0.9999         # teacher EMA 衰减率

    # ── 加载预训练 EMRDM checkpoint 初始化 student ──────────────────────
    # ckpt_path: "/path/to/cuhkv2_emrdm_pretrained.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st.EDMSigma2St
      params:
        alpha: 3.0

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling.ResidualEDMScaling
          params:
            sigma_input: 1.0
            sigma_mu: 1.0
            sigma_cov: 0.9            # cuhkv2 专有：考虑输入-均值协方差

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    # ── Consistency Distillation loss ─────────────────────────────────────
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss.ConsistencyResidualDiffusionLoss
      params:
        loss_type: "l2"
        # 训练时用于采样 (σ_n, σ_{n-1}) 对的时间表步数
        # 对应 cuhkv2 更密集的 sigma 覆盖需求，设为 18
        num_steps: 18
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 100.0

    # ── 1-step sampler ────────────────────────────────────────────────────
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling.ConsistencyResidualSampler
      params:
        # num_steps 仅用于确定 σ_max，推理实际只走 1 步
        num_steps: 4
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 100.0

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: True

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: False

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: False

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: False

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 10000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 5000

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: True
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: True
          return_add_noise: True
          return_cond: True

  trainer:
    devices: 0,
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 5
    max_epochs: 500
