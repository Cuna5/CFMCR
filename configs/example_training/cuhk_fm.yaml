##############################################################################
# EMRDM — Flow Matching (CUHK-CR1 dataset)
#
# Implements Direction 1: Conditional OT Flow Matching for cloud removal.
#
# Key idea
# --------
# Replace the EDM-style mean-reverting diffusion with a straight-line OT path:
#   x_t = (1-t)·μ + t·x_clean,   v* = x_clean - μ (constant velocity)
# The network predicts the velocity field v_θ ≈ x_clean - μ.
# During sampling the ODE is integrated from t≈0 (cloudy) to t≈1 (clean)
# using the Euler method; straighter trajectories allow fewer steps.
#
# Differences from cuhk.yaml
# ---------------------------
# | Component     | cuhk.yaml (EMRDM)             | cuhk_fm.yaml (FM)              |
# |---------------|-------------------------------|--------------------------------|
# | sigma2st      | EDMSigma2St (α=3)             | FlowMatchingSigma2St (s=1-σ)   |
# | scaling       | ResidualEDMScaling            | FlowMatchingScaling (c_skip=0) |
# | loss          | ResidualDiffusionLoss         | FlowMatchingResidualDiffLoss   |
# | sampler       | ResidualEulerEDMSampler       | FlowMatchingResidualSampler    |
# | sigma range   | [0.001, 100]                  | [0.001, 0.999]  (σ = 1-t)      |
# | sigma schedule| power-law (ρ=7)               | linear (ρ=1)                   |
# | engine        | ResidualDiffusionEngine       | ResidualDiffusionEngine (same) |
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion.ResidualDiffusionEngine  # no new engine needed
  params:
    input_key: "label"
    mean_key:  "cond_image"
    compile_model: False
    use_ema: True
    use_flash_attn2: False
    image_metrics: "evaluator"
    # ckpt_path: ""  # optional warm-start from EMRDM checkpoint

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_fm.FlowMatchingSigma2St
      # no extra params — s(σ) = 1-σ

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling_fm.FlowMatchingScaling
          # c_skip=0, c_out=1, c_in=1 — network predicts velocity directly

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    # ── Flow Matching loss ────────────────────────────────────────────────
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_fm.FlowMatchingResidualDiffusionLoss
      params:
        loss_type: "l2"
        t_min: 0.001   # minimum FM time  (σ_max = 1 - t_min ≈ 0.999)
        t_max: 0.999   # maximum FM time  (σ_min = 1 - t_max ≈ 0.001)

    # ── FM Euler sampler (σ: 0.999→0.001, linear steps = straight ODE) ──
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_fm.FlowMatchingResidualSampler
      params:
        num_steps: 4      # straight ODE paths → high quality in fewer steps
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 0.999
            rho: 1          # rho=1 gives a LINEAR σ schedule, matching FM

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: True

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: False

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: False

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/CUHK-CR1"
        nir_datasets_dir: "/remote-home/share/dmb_nas/liuyi/C-CUHK/nir/CUHK-CR1"
        isTrain: False

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 1000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 500

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: False
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: False    # FM does not use mu-shift visualisation
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 6,7
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 1
    max_epochs: 500
