##############################################################################
# MeanFlow-CR — average-velocity restoration flow (CUHK-CR2 dataset)
#
# Same MeanFlow approach as cuhk_meanflow.yaml, adapted for CUHK-CR2
# (thick-cloud dataset): aux_global_mode "nce", longer LR decay, sparser
# checkpointing, check_val_every_n_epoch 5 — mirroring cuhkv2_cfm.yaml.
#
# This config is the FULL method (M1). For the M0 ablation set:
#   network.predict_cloud_mask: false
#   loss.cloud_mask_pred_loss_weight: 0.0
#   sampler.mask_composite: false
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion_cfm.ConsistencyFlowMatchingEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    log_keys: ["cond_image"]
    compile_model: False
    use_flash_attn2: False
    image_metrics: "evaluator"
    # The EMA teacher is kept by the engine but NOT used by MeanFlowLoss.
    teacher_ema_decay: 0.9999
    count_sample_time: True
    count_train_time: True

    # Recommended: warm start from a stable CFM checkpoint.
    # ckpt_path: "/path/to/cuhkv2_cfm_pretrained.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_cfm.ConsistencyFlowMatchingSigma2St

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          # Smooth log-time embedding; see cuhk_meanflow.yaml for rationale.
          target: sgm.modules.diffusionmodules.denoiser_scaling_cfm.MeanFlowScaling

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          # See cuhk_meanflow.yaml: if torch.func.jvp fails with natten, set
          # loss jvp_mode: "fd" or switch to shifted-window attention.
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1
        use_aux_cond: true
        aux_channels: 5
        aux_hidden_channels: 64
        aux_global_mode: "nce"
        aux_tmm_gate_hidden_channels: 32
        # MeanFlow dual-time conditioning (jump-target embedding, zero-init)
        use_dual_time: true
        # Cloud-probability head (zero-init) for mask-guided composition
        predict_cloud_mask: true

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder
          - is_trainable: False
            input_key: "aux_cond"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.DictEmbedder
            params:
              output_key: "aux_cond"

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    # ── MeanFlow loss (teacher-free) ───────────────────────────────────────
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_meanflow.MeanFlowLoss
      params:
        loss_type: "charbonnier"
        charbonnier_eps: 1.0e-3
        meanflow_loss_weight: 1.0
        full_pair_prob: 0.35
        t1_pair_prob: 0.25
        equal_pair_prob: 0.15
        # NATTEN 0.17.x does not reliably support forward-mode AD.
        jvp_mode: "fd"
        fd_eps: 1.0e-2
        clean_endpoint_loss_weight: 1.0
        ssim_endpoint_loss_weight: 0.65   # scan 0.02/0.05/0.1
        non_cloud_identity_loss_weight: 0.2
        cloud_mask_pred_loss_weight: 0.1
        cloud_mask_key: "M"
        cloud_loss_weight: 2.0
        cloud_weight_velocity_anchor: True
        feather_mask_kernel: 7
        # Parent CFM parameters below are ignored by MeanFlowLoss.
        endpoint_loss_weight: 0.0
        consistency_loss_weight: 0.0
        velocity_anchor_loss_weight: 0.0
        start_pair_prob: 0.0
        consistency_warmup_steps: 0
        num_steps: 40
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    # ── MeanFlow sampler (1-step by default) ───────────────────────────────
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_cfm.MeanFlowSampler
      params:
        num_steps: 1
        tta: False
        clamp_output: true
        mask_composite: true
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    scheduler_config:
      target: sgm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 2000
        lr_start: 0.01
        lr_max: 1.0
        lr_min: 0.01
        max_decay_steps: 400000

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR2"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR2"
        isTrain: True
        augment: True
        hflip_p: 0.5
        vflip_p: 0.5
        rot90_p: 0.5
        aux_mode: "full"
        mask_gain: 4.0

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR2"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR2"
        isTrain: False
        aux_mode: "full"
        mask_gain: 4.0

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR2"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR2"
        isTrain: False
        aux_mode: "full"
        mask_gain: 4.0

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR2"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR2"
        isTrain: False
        aux_mode: "full"
        mask_gain: 4.0

lightning:
  # MeanFlow uses torch.func.jvp and an auxiliary mask-head loss exposed
  # outside the velocity return value. DDP must traverse the full loss graph.
  strategy:
    target: pytorch_lightning.strategies.DDPStrategy
    params:
      find_unused_parameters: true

  modelcheckpoint:
    params:
      every_n_train_steps: 10000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 5000

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: True
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: False
          return_denoised: False
          return_add_mu: False
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 2,3
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 5
    max_epochs: 500
