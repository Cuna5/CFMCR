##############################################################################
# EMRDM — Flow Matching (CUHK-CR2 dataset)
#
# Same FM approach as cuhk_fm.yaml, adapted for the CUHK-CR2 dataset with
# cuhkv2 specific settings preserved (batch_size=1, check_val_every_n_epoch=5,
# sigma_cov is not used because FlowMatchingScaling ignores it by design).
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion.ResidualDiffusionEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    compile_model: False
    use_ema: True
    use_flash_attn2: False
    image_metrics: "evaluator"
    # ckpt_path: ""

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_fm.FlowMatchingSigma2St

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling_fm.FlowMatchingScaling

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_fm.FlowMatchingResidualDiffusionLoss
      params:
        loss_type: "l2"
        t_min: 0.001
        t_max: 0.999

    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_fm.FlowMatchingResidualSampler
      params:
        num_steps: 4
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1          # linear σ schedule

    scheduler_config:
      target: sgm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 2000
        lr_start: 0.01
        lr_max: 1.0
        lr_min: 0.01
        max_decay_steps: 400000

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 1          # keep cuhkv2 batch size
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: True

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: False

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: False

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/root/autodl-tmp/dataset/CUHK-CR2"
        nir_datasets_dir: "/root/autodl-tmp/dataset/nir/CUHK-CR2"
        isTrain: False

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 10000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 5000

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: True
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: False
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 0,
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 5   # keep cuhkv2 setting
    max_epochs: 2000
