##############################################################################
# MeanFlow-CR — average-velocity restoration flow (CUHK-CR1 dataset)
#
# Key idea (Geng et al., "Mean Flows for One-step Generative Modeling")
# ---------------------------------------------------------------------
# The network predicts the AVERAGE velocity u(x_s, s, T) over a jump [s, T]
# on the straight OT path x_s = (1-s)·μ + s·x_clean, trained teacher-free
# with the MeanFlow identity:
#
#   u(x_s, s, T) = v(x_s, s) + (T - s)·d/ds u(x_s, s, T)     (JVP target)
#
# 1-step inference is exact by construction:
#   x_pred = μ + u(μ, 0, 1)
#
# This config is the FULL method (M1): MeanFlow + cloud-probability head +
# mask-guided composition. For the M0 ablation (MeanFlow only) set:
#   network.predict_cloud_mask: false
#   loss.cloud_mask_pred_loss_weight: 0.0
#   sampler.mask_composite: false
#
# Warm start from a stable CFM checkpoint is recommended (uncomment
# ckpt_path); all new branches (dual-time embedding, mask head) are
# zero-init, so the loaded model initially behaves exactly like CFM.
##############################################################################

model:
  base_learning_rate: 1.0e-4
  target: sgm.models.diffusion_cfm.ConsistencyFlowMatchingEngine
  params:
    input_key: "label"
    mean_key:  "cond_image"
    log_keys: ["cond_image"]
    compile_model: False
    use_flash_attn2: False
    image_metrics: "evaluator"
    # Enable only for final test/predict runs; FID loads InceptionV3.
    enable_fid: false
    # The EMA teacher is kept by the engine but NOT used by MeanFlowLoss.
    teacher_ema_decay: 0.9999
    count_sample_time: True
    count_train_time: True

    # Recommended: warm start from a stable CFM checkpoint (zero-init keeps
    # the initial behaviour identical), with a reduced learning rate, e.g.
    # base_learning_rate: 2.0e-5.
    # ckpt_path: "/path/to/stable_cfm.ckpt"

    sigma_st_config:
      target: sgm.modules.diffusionmodules.sigma2st_cfm.ConsistencyFlowMatchingSigma2St
      # s(σ) = 1 − σ  (CFM time; unchanged)

    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.ResidualDenoiser
      params:
        scaling_config:
          # Smooth log-time embedding so the JVP time derivative does not
          # vanish at s=0 (the 1-step pair). Coincides with the CFM scaling
          # for t >> 1e-4, so CFM checkpoints warm-start cleanly.
          target: sgm.modules.diffusionmodules.denoiser_scaling_cfm.MeanFlowScaling

    network_wrapper: "sgm.modules.diffusionmodules.wrappers.CloudRemovalWrapper"

    network_config:
      target: sgm.modules.diffusionmodules.k_diffusion.image_transformer.ImageTransformerDenoiserModelInterface
      params:
        in_channels:  8
        out_channels: 4
        patch_size: [1, 1]
        widths: [128, 256, 384, 768]
        depths: [2, 2, 2, 2]
        d_ffs: [256, 512, 768, 1536]
        self_attns:
          # NOTE: natten neighborhood attention may not support forward-mode
          # AD (torch.func.jvp). Run `python test_meanflow_jvp.py` first; if
          # JVP fails, either set loss jvp_mode: "fd" below, or switch the
          # first two levels to {type: "shifted-window", d_head: 64,
          # window_size: 8}.
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "neighborhood", d_head: 64, kernel_size: 7}
          - {type: "global",       d_head: 64}
          - {type: "global",       d_head: 64}
        dropout_rate: [0.0, 0.0, 0.0, 0.1]
        mapping_depth: 2
        mapping_width: 768
        mapping_d_ff: 1536
        mapping_dropout_rate: 0.1
        use_aux_cond: true
        aux_channels: 5
        aux_hidden_channels: 64
        aux_global_mode: "tmm"
        aux_tmm_gate_hidden_channels: 32
        # MeanFlow dual-time conditioning (jump-target embedding, zero-init)
        use_dual_time: true
        # Cloud-probability head (zero-init) for mask-guided composition
        predict_cloud_mask: true
        # V4.1 controls (disabled: MeanFlow has no gamma skip-gate path).
        adaptive_skip_fusion: false
        adaptive_skip_hidden_channels: 16
        adaptive_skip_max_delta: 0.25

    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: True
            input_key: "cond_image"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.IndentityEmbedder
          - is_trainable: False
            input_key: "aux_cond"
            ucg_rate: 0.0
            target: sgm.modules.encoders.modules.DictEmbedder
            params:
              output_key: "aux_cond"

    first_stage_config:
      target: sgm.models.autoencoder.IdentityFirstStage

    # ── MeanFlow loss (teacher-free) ───────────────────────────────────────
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss_meanflow.MeanFlowLoss
      params:
        loss_type: "charbonnier"
        charbonnier_eps: 1.0e-3
        # MeanFlow identity term
        meanflow_loss_weight: 1.0
        # (s, T) pair sampling: 0.35 exact 1-step pair (0,1), 0.25 random
        # start with clean target (s,1), 0.15 pure velocity anchor (s,s),
        # remaining 0.25 generic jumps for multi-step sampling.
        full_pair_prob: 0.35
        t1_pair_prob: 0.25
        equal_pair_prob: 0.15
        # NATTEN 0.17.x does not reliably support forward-mode AD. The FD
        # path preserves logits from the primary grad-enabled forward.
        jvp_mode: "fd"
        fd_eps: 1.0e-2
        # Endpoint supervision (applied on T=1 elements only)
        clean_endpoint_loss_weight: 1.0
        ssim_endpoint_loss_weight: 0.0   # scan 0.02/0.05/0.1
        non_cloud_identity_loss_weight: 0.2
        # Cloud-probability head supervision (must be >0 when
        # predict_cloud_mask=true, otherwise DDP unused-parameter error)
        cloud_mask_pred_loss_weight: 0.1
        cloud_mask_key: "M"
        cloud_loss_weight: 2.0
        cloud_weight_velocity_anchor: True   # also weights the MeanFlow term
        feather_mask_kernel: 7
        # Parent CFM parameters below are ignored by MeanFlowLoss (no EMA
        # teacher, no discrete pair grid) but must stay valid.
        endpoint_loss_weight: 0.0
        consistency_loss_weight: 0.0
        velocity_anchor_loss_weight: 0.0
        start_pair_prob: 0.0
        consistency_warmup_steps: 0
        num_steps: 40
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    # ── MeanFlow sampler (1-step by default) ───────────────────────────────
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling_cfm.MeanFlowSampler
      params:
        num_steps: 1
        tta: False
        # clamp final output to [-1,1] so outlier pixels cannot hurt RMSE/PSNR
        clamp_output: true
        # blend prediction with input using the predicted cloud probability:
        # x_final = (1-m)*mu + m*x_pred (requires predict_cloud_mask=true)
        mask_composite: true
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.EDMDiscretization
          params:
            sigma_min: 0.001
            sigma_max: 1.0
            rho: 1

    scheduler_config:
      target: sgm.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 2000
        lr_start: 0.01
        lr_max: 1.0
        lr_min: 0.01
        max_decay_steps: 100000

    to_rgb_config:
      target: sgm.util.nir_to_rgb

data:
  target: sgm.data.base.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 8
    wrap: True
    train:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: True
        augment: True
        hflip_p: 0.5
        vflip_p: 0.5
        rot90_p: 0.5
        aux_mode: "ndvi_only"
        mask_gain: 4.0

    validation:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: False
        aux_mode: "ndvi_only"
        mask_gain: 4.0

    test:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: False
        aux_mode: "ndvi_only"
        mask_gain: 4.0

    predict:
      target: sgm.data.cuhk.image_datasets.TrainDataset
      params:
        datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/CUHK-CR1"
        nir_datasets_dir: "/data1/home/ely/Projects/CFMCR/dataset/nir/CUHK-CR1"
        isTrain: False
        aux_mode: "ndvi_only"
        mask_gain: 4.0

lightning:
  # MeanFlow uses torch.func.jvp and an auxiliary mask-head loss exposed
  # outside the velocity return value. DDP must traverse the full loss graph.
  strategy:
    target: pytorch_lightning.strategies.DDPStrategy
    params:
      find_unused_parameters: true

  modelcheckpoint:
    params:
      every_n_train_steps: 1000
      monitor: "RMSE"

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 500

    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        batch_frequency: 500
        max_images: 64
        increase_log_steps: False
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          N: 64
          n_rows: 16
          return_intermediate: True
          return_denoised: True
          return_add_mu: False
          return_add_noise: False
          return_cond: True

  trainer:
    devices: 6,7
    num_sanity_val_steps: 0
    benchmark: True
    accumulate_grad_batches: 1
    check_val_every_n_epoch: 1
    max_epochs: 500
